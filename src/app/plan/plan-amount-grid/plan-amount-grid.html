@if (error()) {
  <p role="alert">{{ error() }}</p>
}
<div class="grid-scroll">
  <table>
    <thead>
      <tr>
        <th scope="col">Category</th>
        @for (month of months; track month) {
          <th scope="col">{{ monthShort[month - 1] }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          <th scope="row">
            <app-plan-category-name-input
              [categoryId]="row.id"
              [name]="row.name"
              (nameChange)="nameChange.emit($event)"
            />
          </th>
          @for (month of months; track month) {
            <td>
              <app-plan-amount-cell
                [categoryId]="row.id"
                [month]="month"
                [year]="year()"
                [label]="row.name + ' ' + monthLong[month - 1]"
                [amountCents]="amountFor(row.id, month)"
                (saveError)="onCellError($event)"
                (committed)="onCommitted(row.id, month, $event)"
              />
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
