@if (error()) {
  <p role="alert">{{ error() }}</p>
}
<ul class="status-strip" aria-label="Monthly allocation status">
  @for (monthView of months(); track monthView.month) {
    <li [attr.data-status]="monthView.status">
      <span class="month">{{ monthView.shortLabel }}</span>
      <span class="state" [attr.aria-label]="monthView.longLabel + ' allocation'">{{
        monthView.statusLabel
      }}</span>
    </li>
  }
</ul>
