<section [attr.data-type]="type()">
  <h2>{{ title }}</h2>
  <form (submit)="add($event)">
    <label [attr.for]="'category-name-' + type()">Name</label>
    <input
      [id]="'category-name-' + type()"
      type="text"
      name="categoryName"
      autocomplete="off"
      [value]="nameDraft()"
      (input)="onNameDraft($event)"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="error() ? 'category-error-' + type() : null"
    />
    <button type="submit">Add</button>
  </form>
  @if (error()) {
    <p [id]="'category-error-' + type()" role="alert">{{ error() }}</p>
  }
  @if (year(); as planYear) {
    <app-plan-amount-grid
      [year]="planYear"
      [rows]="rows()"
      (nameChange)="rename($event.id, $event.name)"
      (hide)="hide($event.id)"
    />
  } @else {
    <ul class="active-categories">
      @for (row of rows(); track row.id) {
        <li class="row-actions">
          <app-plan-category-name-input
            [categoryId]="row.id"
            [name]="row.name"
            (nameChange)="rename($event.id, $event.name)"
          />
          <button type="button" [attr.aria-label]="'Hide ' + row.name" (click)="hide(row.id)">
            Hide
          </button>
        </li>
      }
    </ul>
  }
  @if (hiddenRows().length) {
    <details class="hidden-categories">
      <summary>Hidden ({{ hiddenRows().length }})</summary>
      <ul>
        @for (row of hiddenRows(); track row.id) {
          <li class="row-actions">
            <span>{{ row.name }}</span>
            <button type="button" [attr.aria-label]="'Unhide ' + row.name" (click)="unhide(row.id)">
              Unhide
            </button>
          </li>
        }
      </ul>
    </details>
  }
</section>
