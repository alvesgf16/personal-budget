<form (submit)="save($event)">
  <label for="starting-year">Starting year</label>
  <input
    id="starting-year"
    type="number"
    name="startingYear"
    inputmode="numeric"
    step="1"
    [value]="startingYearInput()"
    (input)="setFieldFromEvent(startingYearInput, $event, 'startingYear')"
    [attr.aria-invalid]="invalidField() === 'startingYear' ? 'true' : null"
    [attr.aria-describedby]="
      invalidField() === 'startingYear' ? 'starting-year-help settings-error' : 'starting-year-help'
    "
  />
  <p id="starting-year-help">This year appears in the Plan tab header.</p>

  <label for="late-income-shift">Late monthly income</label>
  <select
    id="late-income-shift"
    name="lateIncomeShift"
    [value]="lateIncomeShift()"
    (change)="setFieldFromEvent(lateIncomeShift, $event, 'lateIncomeShift')"
    [attr.aria-invalid]="invalidField() === 'lateIncomeShift' ? 'true' : null"
    [attr.aria-describedby]="
      invalidField() === 'lateIncomeShift'
        ? 'late-income-shift-help settings-error'
        : 'late-income-shift-help'
    "
  >
    <option value="inactive">Inactive</option>
    <option value="active">Active</option>
  </select>
  <p id="late-income-shift-help">
    When active, income on or after the starting day counts toward the next month.
  </p>

  <label for="late-income-shift-starting-day">Starting day</label>
  <input
    id="late-income-shift-starting-day"
    type="number"
    name="lateIncomeShiftStartingDay"
    inputmode="numeric"
    step="1"
    [min]="dayMin"
    [max]="dayMax"
    [value]="lateIncomeShiftStartingDay()"
    (input)="setFieldFromEvent(lateIncomeShiftStartingDay, $event, 'lateIncomeShiftStartingDay')"
    [disabled]="lateIncomeShift() === 'inactive'"
    [attr.aria-invalid]="invalidField() === 'lateIncomeShiftStartingDay' ? 'true' : null"
    [attr.aria-describedby]="
      invalidField() === 'lateIncomeShiftStartingDay'
        ? 'late-income-shift-starting-day-help settings-error'
        : 'late-income-shift-starting-day-help'
    "
  />
  <p id="late-income-shift-starting-day-help">
    Day of the month ({{ dayMin }}&ndash;{{ dayMax }}) when the shift begins.
  </p>

  @if (error()) {
    <p id="settings-error" role="alert">{{ error() }}</p>
  }
  <button type="submit" [disabled]="!formReady()">Save</button>
</form>
